<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>freeCodeCamp Survey Form</title>
</head>
<body>
  
  <div class="form-contain">
    <h1>freeCodeCamp Survey Form</h1>
    <p class="secondtitle">Thank you for taking the time to help us improve the platform</p>

    <!--form-->
    <form class="survey" action="#" method="post">
      <!--name-->
      <div class="form-group">
        <label for="name" class="flabel">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" class="fenter">
      </div>

      <!--email-->
      <div class="form-group">
        <label for="email" class="flabel">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your Email" class="fenter">
      </div>

      <!--age-->
      <div class="form-group">
        <label for="age" class="flabel">Age (optional)</label>
        <input type="number" id="age" name="age" placeholder="Age" class="fenter">
      </div>
      
      <!--current role-->
      <div class="form-group">
        <label for="role" class="flabel">Which option best describes your current role?</label>
        <select id="role" name="role" class="fenter">
          <option value="" disabled selected>Select current role</option>
          <option value="student">Student</option>
          <option value="full-time-job">Full Time Job</option>
          <option value="full-time-learner">Full Time Learner</option>
          <option value="prefer-not">Prefer not to say</option>
          <option value="other">Other</option>
        </select>
      </div>
      
      <!--recommend-->
      <div class="form-group">
          <p class="flabel">Would you recommend freeCodeCamp to a friend?</p>
          <div class="rgroup">
            <label class="rlabel">
              <input type="radio" name="recommend" value="definitely" class="rselect">
              Definitely
            </label>

            <label class="rlabel">
              <input type="radio" name="recommend" value="maybe" class="rselect">
              Maybe
            </label>

            <label class="rlabel">
              <input type="radio" name="recommend" value="not-sure" class="rselect">
              Not sure
            </label>
          </div>
      </div>
      
      <!--favorite-->
      <div class="form-group">
        <label for="favorite" class="flabel">What is your favorite feature of freeCodeCamp?</label><br>
        <select id="favorite" name="favorite" class="fenter">
          <option value="" disabled selected>Select an option</option>
          <option value="challenges">Challenges</option>
          <option value="projects">Projects</option>
          <option value="community">Community</option>
          <option value="open-source">Open Source</option>
          <option value="videos">Videos</option>
          <option value="forum">Forum</option>
        </select>
      </div>
      
      <!--improvement-->
      <div class="form-group">
          <p class="flabel">What would you like to see improved? (Check all that apply)</p>

          <label class="checlabel">
            <input type="checkbox" name="improvements" class="checkenter" value="frontend-projects">Front-end Projects
          </label>
          <label class="checlabel">
            <input type="checkbox" name="improvements" class="checkenter" value="backend-projects">Back-end Projects
          </label>          
          <label class="checlabel">
            <input type="checkbox" name="improvements" class="checkenter" value="data-visualization">Data Visualization
          </label>          
          <label class="checlabel">
            <input type="checkbox" name="improvements" class="checkenter" value="challenges">Challenges
          </label>          
          <label class="checlabel">
            <input type="checkbox" name="improvements" class="checkenter" value="open-source">Open Source Community
          </label>          
          <label class="checlabel">
            <input type="checkbox" name="improvements" class="checkenter" value="gitter">Gitter help rooms
          </label>          
          <label class="checlabel">
            <input type="checkbox" name="improvements" class="checkenter" value="videos">Videos
          </label>          
          <label class="checlabel">
            <input type="checkbox" name="improvements" class="checkenter" value="meetups">City Meetups
          </label>          
          <label class="checlabel">
            <input type="checkbox" name="improvements" class="checkenter" value="wiki">Wiki
          </label>          
          <label class="checlabel">
            <input type="checkbox" name="improvements" class="checkenter" value="forum">Forum
          </label>          
          <label class="checlabel">
            <input type="checkbox" name="improvements" class="checkenter" value="additional-courses">Additional Courses
          </label>
      </div>
      
      <!--comment-->
      <div class="form-group">
        <label for="comments" class="flabel">Any comments or suggestions?</label><br>
        <textarea id="comments" name="comments" class="fenter" rows="5" placeholder="Enter your comment here.."></textarea><br>
      </div>
      
      <!--submit-->
      <div class="form-group">
        <button type="submit" class="submit-btn">Submit</button>
      </div>

    </form>

  </div>
</body>
</html>
